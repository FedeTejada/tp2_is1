
{% extends "base.html" %}

{% block title %}Perfil de {{ user.username }}{% endblock %}

{% block content %}

<section class="users-section">

    <div class="user-card">
        <div class="user-avatar">
            {{ user.name[0]|upper }}{{ user.lastname[0]|upper }}
        </div>

        <div class="user-info">
            <h3>{{ user.name }} {{ user.lastname }}</h3>
            <span class="username">@{{ user.username }}</span>
            <p>{{ user.email }}</p>
        </div>
    </div>

    <div class="user-actions">
        <a href="{{ url_for('users.edit_user', id=user.id) }}" class="btn btn-primary">
            Editar usuario
        </a>
        <button type="button" id="delete-user-btn" data-user-id="{{ user.id }}" class="btn btn-danger">
            Eliminar usuario
        </button>
        <a href="{{ url_for('users.index') }}" class="btn btn-secondary">
        Volver atrás
        </a>
    </div>
</section>

{% endblock %}
