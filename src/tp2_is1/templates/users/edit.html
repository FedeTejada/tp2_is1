{% extends "base.html" %}

{% block title %}Editar usuario{% endblock %}

{% block content %}

<section class="auth-container">
    <div class="auth-card">

        <h1>Editar usuario</h1>

        <form id="edit-user-form" data-user-id="{{ user.id }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ user.username }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="name">Nombre</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ user.name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="lastname">Apellido</label>
                <input
                    type="text"
                    id="lastname"
                    name="lastname"
                    value="{{ user.lastname }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Guardar cambios
            </button>

        </form>

    </div>
</section>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/users.js') }}"></script>
{% endblock %}
